name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: android

      - name: Enforce Gradle 8.7
        run: |
          # Ensure Gradle 8.7 is used (AGP 8.3 requires Gradle 8.4-8.7 and fails on Gradle 9.x)
          if ! command -v gradle &> /dev/null || ! gradle --version 2>&1 | grep -q "Gradle 8.7"; then
            echo "Gradle in PATH is not 8.7. Installing official Gradle 8.7..."
            curl -sSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o /tmp/gradle-8.7-bin.zip -d /tmp
            chmod +x /tmp/gradle-8.7/bin/gradle
            echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
            export PATH="/tmp/gradle-8.7/bin:$PATH"
          fi
          if [ -x "/tmp/gradle-8.7/bin/gradle" ]; then
            /tmp/gradle-8.7/bin/gradle --version
          else
            gradle --version
          fi

      - name: Ensure Debug Keystore
        run: |
          cd android/app
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          cd android
          GRADLE_EXEC="gradle"
          if [ -x "/tmp/gradle-8.7/bin/gradle" ]; then
            GRADLE_EXEC="/tmp/gradle-8.7/bin/gradle"
          fi
          echo "Building with: $($GRADLE_EXEC --version | head -n 3)"
          $GRADLE_EXEC assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-control-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

